---
name: Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Test
              run: npm test

            - name: Build
              env:
                  NEXT_PUBLIC_WIX_CLIENT_ID: ci-placeholder-client-id
                  NEXT_PUBLIC_WIX_APP_ID: ci-placeholder-app-id
                  FEATURED_PRODUCTS_CATEGORY_ID: ci-placeholder-category-id
              run: npm run build
