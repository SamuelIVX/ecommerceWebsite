---
name: PR Size Label

on:
  pull_request_target: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  size-label:
    name: Label PR Size
    runs-on: ubuntu-latest
    steps:
      - name: size-label
        uses: pascalgn/size-label-action@56b489b027932ec0cf60438a1a5f1a19c8fc71ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: >
            {
              "0": "XS",
              "20": "S",
              "100": "M",
              "400": "L",
              "1000": "XL"
            }

  warn-if-large:
    name: Warn on oversized PRs
    runs-on: ubuntu-latest
    needs: size-label
    if: contains(needs.size-label.outputs.label, 'XL') || contains(needs.size-label.outputs.label, 'L')
    steps:
      - run: echo "::warning::This PR is large — consider splitting it before merging, especially for security-fix PRs."
