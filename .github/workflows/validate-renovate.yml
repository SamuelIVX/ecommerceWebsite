---
name: Validate Renovate Configuration

on:
    pull_request:
        paths:
            - ".github/renovate.json"
            - ".github/renovate/**"
            - "renovate.json"
            - "renovate.json5"
            - ".renovaterc*"
    workflow_dispatch: {}

concurrency:
    group: validate-renovate-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install Renovate
              run: npm i -g renovate@44.16.1

            - name: Validate config (strict)
              run: renovate-config-validator .github/renovate.json --strict --no-global
